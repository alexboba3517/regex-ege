<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Регулярные выражения{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='15' font-weight='bold' fill='white' text-anchor='middle'%3Ere%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <span class="brand">regex-ege</span>
      <div class="site-nav-links">
        <a href="{{ url_for('theory_index') }}" class="{{ 'active' if active == 'theory' else '' }}">Теория</a>
        <a href="{{ url_for('practice_index') }}" class="{{ 'active' if active == 'practice' else '' }}">Практика</a>
      </div>
      <span class="progress-pill" id="nav-progress-pill" title="Решено упражнений всего"></span>
      <button type="button" id="reset-progress-btn" class="reset-progress-btn" title="Сбросить весь прогресс">&#8635;</button>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- {block_id: [exercise_id, ...]} по всем блокам — нужно JS, чтобы
       считать прогресс (сколько всего упражнений и сколько решено). -->
  <script type="application/json" id="exercise-map">{{ exercise_map | tojson }}</script>
  <script src="{{ url_for('static', filename='progress.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
